services:
  - type: web
    name: bloodlink-api
    env: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # Set this in Render dashboard
      - key: SESSION_SECRET
        generateValue: true
